version: "3.8"

services:
  user-service:
    build: ./services/user-service
    container_name: user-service
    expose:
      - "5000"
    networks:
      - micro-net

  product-service:
    build: ./services/product-service
    container_name: product-service
    expose:
      - "5000"
    networks:
      - micro-net

  order-service:
    build: ./services/order-service
    container_name: order-service
    expose:
      - "5000"
    networks:
      - micro-net

  gateway-service:
    build: ./services/gateway-service
    container_name: gateway-service
    ports:
      - "80:5000"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - micro-net

networks:
  micro-net:
    driver: bridge
